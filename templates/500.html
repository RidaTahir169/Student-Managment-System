{% extends 'base.html' %}

{% block title %}500 Internal Server Error - SMS{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 w-100">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card card-custom p-5 bg-white">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-octagon" style="font-size: 5rem;"></i>
            </div>
            <h1 class="fw-bold text-danger">500</h1>
            <h4 class="fw-bold mb-3">Internal Server Error</h4>
            <p class="text-muted mb-4">
                Something went wrong on our end. Please try refreshing the page or contact the system administrator if the problem persists.
            </p>
            <div>
                <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4 py-2 rounded-pill fw-semibold shadow-sm">
                    <i class="bi bi-arrow-clockwise me-1"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
