{% extends 'base.html' %}

{% block title %}403 Forbidden - Access Denied{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card card-custom p-5 bg-white">
            <div class="text-danger mb-3">
                <i class="bi bi-shield-x" style="font-size: 5rem;"></i>
            </div>
            <h1 class="fw-bold text-danger">403</h1>
            <h4 class="fw-bold mb-3">Access Denied / Forbidden</h4>
            <p class="text-muted mb-4">
                You do not have the required role privileges to access this area of the Student Management System.
            </p>
            <div>
                <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4 py-2 rounded-pill">
                    <i class="bi bi-house-door me-1"></i> Return to My Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
